<div class="card bg-dark border-secondary shadow-lg">

  <div class="card-header bg-primary text-white text-center py-3">
    <h3 class="mb-0 fw-bold">{{ titulo }}</h3>
  </div>

  <div class="card-body p-0">

    <table class="table table-dark table-hover table-striped mb-0 text-center align-middle">

      <thead class="table-primary text-dark">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Jugador</th>
          <th scope="col">Puntaje</th>
        </tr>
      </thead>

      <tbody>

        @if(ranking.length > 0){

          @for(jugador of ranking; track jugador.usuario; let i = $index){

            <tr>
              <td class="fw-bold">
                @if(i === 0) { 1 } 
                @else if(i === 1) { 2 } 
                @else if(i === 2) { 3 } 
                @else {{{ i + 1 }}}
              </td>
              <td class="fw-semibold">{{ jugador.usuario }}</td>
              <td><span class="badge bg-success fs-6 px-3 py-2"> {{ jugador.puntaje }} pts</span></td>
            </tr>
          }

        } @else {

          <tr>
            <td colspan="3" class="py-4 text-secondary"> No hay resultados</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
