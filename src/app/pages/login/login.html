<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow-lg border-0">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <form>
          <div class="mb-3">
            <label class="form-label fw-semibold">Correo electrónico</label>
            <input type="email" class="form-control" placeholder="ejemplo@mail.com" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control" placeholder="********" />
          </div>

          <button class="btn btn-primary w-100 py-2">Ingresar</button>
        </form>

        <div class="text-center mt-3">
          <small>¿No tenés cuenta?</small><br />
          <a routerLink="/register" class="text-decoration-none fw-semibold">Registrate acá</a>
        </div>
      </div>
    </div>
  </div>
</div>
